 화살표 = 다음 장으로 가져가는 것</text></g><line x1="0" y1="129" x2="1280" y2="129" stroke="#c5cfdb" stroke-width="2" pointer-events="none" data-role="heading-divider"/><g id="edges"><g data-edge="c0" class="edge"><path d="M 640 235 L 640 315" fill="none" stroke="#5A1E1E" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead-0)"/><text x="650" y="280" text-anchor="start" font-size="16" font-weight="750" fill="#5A1E1E" class="edge-label" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">uart_core · mac_core</text></g><g data-edge="c1" class="edge"><path d="M 640 385 L 640 465" fill="none" stroke="#5A1E1E" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead-1)"/><text x="650" y="430" text-anchor="start" font-size="16" font-weight="750" fill="#5A1E1E" class="edge-label" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">11장 UART 적재기 · 4PE · BRAM</text></g><g data-edge="c2" class="edge"><path d="M 640 535 L 640 615" fill="none" stroke="#5A1E1E" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead-2)"/><text x="650" y="580" text-anchor="start" font-size="16" font-weight="750" fill="#5A1E1E" class="edge-label" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">Dense 코어 · argmax · 13장 입력 계약</text></g><g data-edge="c3" class="edge"><path d="M 640 685 L 640 765" fill="none" stroke="#5A1E1E" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead-3)"/><text x="650" y="730" text-anchor="start" font-size="16" font-weight="750" fill="#5A1E1E" class="edge-label" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">매개변수 784 코어 (NPE=4, INT8)</text></g><g data-edge="c4" class="edge"><path d="M 640 835 L 640 915" fill="none" stroke="#5A1E1E" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead-4)"/><text x="650" y="880" text-anchor="start" font-size="16" font-weight="750" fill="#5A1E1E" class="edge-label" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">SoC · 드라이버 · AXI 래퍼 틀</text></g><g data-edge="c5" class="edge"><path d="M 640 985 L 640 1077.5" fill="none" stroke="#7a7f8a" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead-5)"/><text x="650" y="1036.25" text-anchor="start" font-size="16" font-weight="750" fill="#7a7f8a" class="edge-label" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">검토 예정</text></g></g><g id="nodes"><g data-node="P1" class="node"><rect x="320" y="165" width="640" height="70" fill="none" stroke="#1F3A5F" stroke-width="3.2" class="node-shape" pointer-events="all"/><text x="640" y="189" text-anchor="middle" dominant-baseline="middle" pointer-events="none" font-size="22" font-weight="750" fill="#172439" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">1장 · UART 계산기 · 서브젝트 1-1~1-4 (구 00~03)</text><text x="640" y="214" text-anchor="middle" dominant-baseline="middle" pointer-events="none" font-size="16" font-weight="400" fill="#273e5e" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">보드: PC가 보낸 두 수의 곱·누산 결과가 UART로 돌아옴 (에코 → 곱셈 → 누산 → 파이프라인)</text></g><g data-node="P2" class="node"><rect x="352.5" y="315" width="575" height="70" fill="none" stroke="#1F3A5F" stroke-width="3.2" class="node-shape" pointer-events="all"/><text x="640" y="339" text-anchor="middle" dominant-baseline="middle" pointer-events="none" font-size="22" font-weight="750" fill="#172439" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">2장 · 4뉴런 NPU 보드 · 2-1~2-9 (구 04~12)</text><text x="640" y="364" text-anchor="middle" dominant-baseline="middle" pointer-events="none" font-size="16" font-weight="400" fill="#273e5e" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">보드: UART로 가중치·입력을 적재하면 4뉴런 출력이 UART·LED에 보임 (지금 12장)</text></g><g data-node="P3" class="node"><rect x="345" y="465" width="590" height="70" fill="none" stroke="#1F3A5F" stroke-width="3.2" class="node-shape" pointer-events="all"/><text x="640" y="489" text-anchor="middle" dominant-baseline="middle" pointer-events="none" font-size="22" font-weight="750" fill="#172439" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">3장 · 8×8 MNIST 분류기 (CPU 없음) · 3-1~3-4 (구 13~16)</text><text x="640" y="514" text-anchor="middle" dominant-baseline="middle" pointer-events="none" font-size="16" font-weight="400" fill="#273e5e" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">보드: UART로 보낸 8×8 손글씨의 10개 점수와 클래스가 UART·7세그먼트에 보임</text></g><g data-node="P4" class="node"><rect x="337.5" y="615" width="605" height="70" fill="none" stroke="#1F3A5F" stroke-width="3.2" class="node-shape" pointer-events="all"/><text x="640" y="639" text-anchor="middle" dominant-baseline="middle" pointer-events="none" font-size="22" font-weight="750" fill="#172439" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">4장 · 784 가속기 설계 공간 · 4-1~4-3 (구 17~19)</text><text x="640" y="664" text-anchor="middle" dominant-baseline="middle" pointer-events="none" font-size="16" font-weight="400" fill="#273e5e" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">보드: 같은 그림 10장을 INT8·INT16, PE 수별로 돌려 정답 수·CYCLES 표를 UART로 출력</text></g><g data-node="P5" class="node"><rect x="325" y="765" width="630" height="70" fill="none" stroke="#1F3A5F" stroke-width="3.2" class="node-shape" pointer-events="all"/><text x="640" y="789" text-anchor="middle" dominant-baseline="middle" pointer-events="none" font-size="22" font-weight="750" fill="#172439" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">5장 · MicroBlaze V SoC · 5-1~5-7 (구 20·21·22·27·23·24·25)</text><text x="640" y="814" text-anchor="middle" dominant-baseline="middle" pointer-events="none" font-size="16" font-weight="400" fill="#273e5e" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">보드: CPU 드라이버로 NPU 추론, LED·7세그먼트 표시, 같은 빌드로 시간·자원·전력 측정</text></g><g data-node="P6" class="node"><rect x="367.5" y="915" width="545" height="70" fill="none" stroke="#1F3A5F" stroke-width="3.2" class="node-shape" pointer-events="all"/><text x="640" y="939" text-anchor="middle" dominant-baseline="middle" pointer-events="none" font-size="22" font-weight="750" fill="#172439" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">6장 · 응용 확장 · 6-1~6-5 (구 28·26·29·30·31)</text><text x="640" y="964" text-anchor="middle" dominant-baseline="middle" pointer-events="none" font-size="16" font-weight="400" fill="#273e5e" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">보드: 손글씨 전송, CNN, 센서 감시, 모터 인터록, 인증 틀을 P5 SoC에 붙여 시연</text></g><g data-node="CAP" class="node"><rect x="477.5" y="1077.5" width="325" height="65" fill="none" stroke="#7a7f8a" stroke-width="2" class="node-shape" pointer-events="all"/><text x="640" y="1099.5" text-anchor="middle" dominant-baseline="middle" pointer-events="none" font-size="18" font-weight="750" fill="#3a3f4a" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">7장 · 종합과제 (나중에 검토)</text><text x="640" y="1122" text-anchor="middle" dominant-baseline="middle" pointer-events="none" font-size="15" font-weight="400" fill="#3a3f4a" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif">1~6장 결과를 묶는 과제 — 범위·평가는 별도 결정</text></g></g></svg>
