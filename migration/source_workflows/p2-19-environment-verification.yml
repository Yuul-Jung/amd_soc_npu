name: P2-19 Multi-Sensor Environment Policy RTL Verification
on:
  push:
    branches: ['work/part02-second-half-20261110']
    paths:
      - 'part02/chapters/P2_19_Lesson/**'
      - '.github/workflows/p2-19-environment-verification.yml'
  pull_request:
    paths:
      - 'part02/chapters/P2_19_Lesson/**'
      - '.github/workflows/p2-19-environment-verification.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  environment-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
      - name: Test Bosch BME280 chip ID and raw ADC host driver
        run: bash part02/chapters/P2_19_Lesson/tests/run_host_tests.sh
      - name: Test multi-sensor priority, fallback, pages and alarms
        run: bash part02/chapters/P2_19_Lesson/tests/run_rtl_tests.sh
      - name: Validation boundary
        run: echo "Environment POLICY RTL unit only; actual BME280 I2C, sensor/AXI integration, Vivado/Vitis/BOARD/UVM NOT_RUN."
